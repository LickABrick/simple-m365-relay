services:
  postfix:
    build:
      context: .
      dockerfile: apps/relay/Dockerfile
    container_name: simple-m365-relay-postfix
    restart: unless-stopped
    ports:
      - "25:25"
      - "587:587"
    security_opt:
      - no-new-privileges:true
    environment:
      RELAY_TLS_GENERATE_SELF_SIGNED: ${RELAY_TLS_GENERATE_SELF_SIGNED:-true}
      RELAY_TLS_CERT_PATH: ${RELAY_TLS_CERT_PATH:-/data/certs/tls.crt}
      RELAY_TLS_KEY_PATH: ${RELAY_TLS_KEY_PATH:-/data/certs/tls.key}
      RELAY_TLS_SELF_SIGNED_CN: ${RELAY_TLS_SELF_SIGNED_CN:-relay.local}

      CONTROL_BIND: ${CONTROL_BIND:-0.0.0.0}
      CONTROL_PORT: ${CONTROL_PORT:-18080}
      # Control API transport:
      # - Leave CONTROL_SOCKET empty to use TCP on :18080 inside the Docker network (recommended for cross-container reliability).
      # - Set CONTROL_SOCKET to enable unix socket.
      CONTROL_SOCKET: ${CONTROL_SOCKET:-}
      # Shared token required for all control API calls (UI → postfix)
      # If unset, postfix generates /data/state/control.token and UI reads it from the shared volume.
      CONTROL_TOKEN: ${CONTROL_TOKEN:-}

      # Reduce chance of secrets in logs by default
      OAUTH_LOG_FULL_TRACE: ${OAUTH_LOG_FULL_TRACE:-no}
      OAUTH_LOG_TO_SYSLOG: ${OAUTH_LOG_TO_SYSLOG:-yes}
    volumes:
      - simple-m365-relay-data:/data
    expose:
      - "18080"
    healthcheck:
      test: ["CMD-SHELL", "grep -qx master /proc/1/comm && doveadm service status auth >/dev/null 2>&1"]
      start_period: 15s
      interval: 30s
      timeout: 10s
      retries: 3

  ui:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: simple-m365-relay-ui
    restart: unless-stopped
    ports:
      # Loopback-only by default. Set UI_HOST_BIND=0.0.0.0 only when a firewall
      # or authenticated TLS reverse proxy protects the UI.
      - "${UI_HOST_BIND:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -ILkfs --max-time 3 http://localhost:8000/healthz > /dev/null || exit 1"]
      start_period: 10s
      interval: 30s
      timeout: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The root entrypoint prepares the named volume and immediately drops to
    # UID/GID 10001. Keep only the capabilities required for that bootstrap.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
    environment:
      UI_BIND: ${UI_BIND:-0.0.0.0}
      UI_PORT: ${UI_PORT:-8000}
      ORIGIN: ${UI_ORIGIN:-http://localhost:8000}
      UI_BASE_URL: ${UI_BASE_URL:-}
      # If behind a TLS-terminating reverse proxy, you likely want:
      #   FORCE_SECURE_COOKIES=1 and TRUST_PROXY_HEADERS=1
      FORCE_SECURE_COOKIES: ${FORCE_SECURE_COOKIES:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-}
      POSTFIX_CONTROL_URL: ${POSTFIX_CONTROL_URL:-http://postfix:18080}
      # If set, UI uses unix socket instead of TCP for control API.
      POSTFIX_CONTROL_SOCKET: ${POSTFIX_CONTROL_SOCKET:-}
      CONTROL_TOKEN: ${CONTROL_TOKEN:-}
      DATA_DIR: ${DATA_DIR:-/data}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-12M}
    volumes:
      - simple-m365-relay-data:/data
    depends_on:
      postfix:
        condition: service_started

volumes:
  # Keep the underlying Docker volume name to preserve existing data
  simple-m365-relay-data:
    name: ms365-relay_ms365-relay-data
