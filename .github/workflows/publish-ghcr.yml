name: Publish Docker images to GHCR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.2.3, v1.2.3-rc.1)"
        required: true
        type: string
      prerelease:
        description: "Treat as prerelease (do not move :latest)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ui
            image_name: simple-m365-relay-ui
            dockerfile: ui/Dockerfile
          - name: postfix
            image_name: simple-m365-relay-postfix
            dockerfile: postfix/Dockerfile

    steps:
      - name: Checkout
<<<<<<< HEAD
