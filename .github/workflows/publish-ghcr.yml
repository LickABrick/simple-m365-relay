name: Publish Docker images to GHCR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.2.3, v1.2.3-rc.1)"
        required: true
        type: string
      prerelease:
        description: "Treat as prerelease (do not move :latest)"
        required: false
        default: false
        type: boolean
      platforms:
        description: "Comma-separated target platforms"
        required: false
        default: "linux/amd64,linux/arm64"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ui
            image_name: simple-m365-relay-ui
            dockerfile: apps/web/Dockerfile
          - name: postfix
            image_name: simple-m365-relay-postfix
            dockerfile: apps/relay/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image + tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            ver="${{ github.event.release.tag_name }}"
            pre="${{ github.event.release.prerelease }}"
          else
            ver="${{ inputs.version }}"
            pre="${{ inputs.prerelease }}"
          fi

          # Accept both v1.2.3 and 1.2.3
          ver_no_v="${ver#v}"

          # Validate version input (prevent newline/whitespace/tag injection)
          if [[ "$ver_no_v" =~ [[:space:]] ]] || [[ "$ver_no_v" == *$'\n'* ]] || [[ "$ver_no_v" == *$'\r'* ]]; then
            echo "Invalid version (whitespace/newlines not allowed): $ver_no_v" >&2
            exit 1
          fi
          if [[ ! "$ver_no_v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid version (expected semver): $ver_no_v" >&2
            exit 1
          fi

          sha_short="${GITHUB_SHA::7}"

          owner_lc="${{ github.repository_owner }}"
          owner_lc="$(printf '%s' "$owner_lc" | tr '[:upper:]' '[:lower:]')"

          image="ghcr.io/${owner_lc}/${{ matrix.image_name }}"

          # Build tag list (one per line) without breaking YAML indentation.
          tag_lines="$(printf '%s\n' \
            "$image:$ver_no_v" \
            "$image:sha-$sha_short" \
          )"

          # Only move :latest on non-prerelease releases.
          if [[ "$pre" == "false" ]]; then
            tag_lines="$(printf '%s\n' \
              "$tag_lines" \
              "$image:latest" \
            )"
          fi

          {
            echo "image=$image"
            echo "ver_no_v=$ver_no_v"
            echo "tags<<EOF"
            echo "$tag_lines"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.tags.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ github.event_name == 'release' && 'linux/amd64,linux/arm64' || inputs.platforms }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.ver_no_v }}
            APP_GITHUB_REPO=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
