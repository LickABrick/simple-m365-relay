        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
>>>>>>> 41e7664 (chore(deps): pin dependencies)

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image + tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            ver="${{ github.event.release.tag_name }}"
            pre="${{ github.event.release.prerelease }}"
          else
            ver="${{ inputs.version }}"
            pre="${{ inputs.prerelease }}"
          fi

          # Accept both v1.2.3 and 1.2.3
          ver_no_v="${ver#v}"

          # Validate version input (prevent newline/whitespace/tag injection)
          if [[ "$ver_no_v" =~ [[:space:]] ]] || [[ "$ver_no_v" == *$'\n'* ]] || [[ "$ver_no_v" == *$'\r'* ]]; then
            echo "Invalid version (whitespace/newlines not allowed): $ver_no_v" >&2
            exit 1
          fi
          if [[ ! "$ver_no_v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid version (expected semver): $ver_no_v" >&2
            exit 1
          fi

          sha_short="${GITHUB_SHA::7}"

          owner_lc="${{ github.repository_owner }}"
          owner_lc="$(printf '%s' "$owner_lc" | tr '[:upper:]' '[:lower:]')"

          image="ghcr.io/${owner_lc}/${{ matrix.image_name }}"

          # Build tag list (one per line) without breaking YAML indentation.
          tag_lines="$(printf '%s\n' \
            "$image:$ver_no_v" \
            "$image:sha-$sha_short" \
          )"

          # Only move :latest on non-prerelease releases.
          if [[ "$pre" == "false" ]]; then
            tag_lines="$(printf '%s\n' \
              "$tag_lines" \
              "$image:latest" \
            )"
          fi

          {
            echo "image=$image"
            echo "ver_no_v=$ver_no_v"
            echo "tags<<EOF"
            echo "$tag_lines"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.tags.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.ver_no_v }}
            APP_GITHUB_REPO=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
