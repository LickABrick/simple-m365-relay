services:
  postfix:
    build:
      context: ../..
      dockerfile: apps/relay/Dockerfile
    restart: unless-stopped
    environment:
      RELAY_HOSTNAME: relay.e2e.local
      RELAY_DOMAIN: e2e.local
      RELAY_MYNETWORKS: 127.0.0.0/8
      RELAY_SMTPD_TLS_LEVEL_25: may
      RELAY_SMTPD_TLS_LEVEL_587: encrypt
      RELAY_TLS_GENERATE_SELF_SIGNED: "true"
      RELAY_TLS_CERT_PATH: /data/certs/tls.crt
      RELAY_TLS_KEY_PATH: /data/certs/tls.key
      RELAY_TLS_SELF_SIGNED_CN: relay.e2e.local
      RELAYHOST: "[smtp.office365.com]:587"
      MS365_SMTP_USER: "postfix@example.com"
      MS365_TENANT_ID: "00000000-0000-0000-0000-000000000000"
      MS365_CLIENT_ID: "11111111-1111-1111-1111-111111111111"
      CONTROL_SOCKET: /data/state/control.sock
      CONTROL_TOKEN: ""
      AUTO_TOKEN_REFRESH_MINUTES: "0"
    volumes:
      - e2e-data:/data
    expose:
      - "18080"

  ui:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      UI_BIND: 0.0.0.0
      UI_PORT: "8000"
      POSTFIX_CONTROL_URL: http://postfix:18080
      POSTFIX_CONTROL_SOCKET: /data/state/control.sock
      CONTROL_TOKEN: ""
      RELAY_DOMAIN: e2e.local
      DATA_DIR: /data
      # UI-only metadata
      APP_VERSION: "e2e"
      APP_GITHUB_REPO: "LickABrick/simple-m365-relay"
      UPDATE_CHECK_TTL_SECONDS: "3600"
    volumes:
      - e2e-data:/data
    depends_on:
      - postfix

  e2e:
    image: python:3.12-alpine
    working_dir: /tests
    volumes:
      - ./e2e_common.py:/tests/e2e_common.py:ro
      - ./e2e_core.py:/tests/e2e_core.py:ro
    depends_on:
      - ui
    command: ["sh","-lc","python -u e2e_core.py"]

volumes:
  e2e-data:
